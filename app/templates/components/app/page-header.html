<!-- Page head: breadcrumbs, title, short description, action buttons -->
<div class="mb-6 px-1">
    <div class="flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between">
        <div>
            <nav class="mb-1 flex items-center gap-1.5 text-xs text-neutral-400" aria-label="Breadcrumb">
                {% block breadcrumbs %}
                    <a href="{% url ACCOUNTS.DASHBOARD %}" class="hover:text-neutral-600 dark:hover:text-neutral-300">Home</a>
                {% endblock %}
            </nav>
            <h1 class="font-display text-2xl font-semibold tracking-tight text-neutral-900 dark:text-white">
                {% block page_title %}Hello {{ user.first_name|title }}{% endblock %}
            </h1>
            <p class="mt-1 max-w-2xl text-sm text-neutral-500 dark:text-neutral-400">
                {% block page_subtitle %}Laying the digital bricks, watch this page come alive piece by piece!{% endblock %}
            </p>
        </div>

        <div class="flex shrink-0 gap-2">
            {% block page_actions %}
                {% comment %} <button type="button" class="inline-flex items-center gap-2 rounded-lg border border-neutral-200 px-3 py-2 text-sm font-medium text-neutral-600 hover:bg-neutral-100 dark:border-neutral-700 dark:text-neutral-300 dark:hover:bg-neutral-800">
                    <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M14 3v4a1 1 0 0 0 1 1h4" />
                        <path d="M5 21v-16a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2z" />
                        <path d="M9 9h1" />
                        <path d="M9 13h6" />
                        <path d="M9 17h6" />
                    </svg>
                    <span>View docs</span>
                </button> {% endcomment %}
                <button type="button" class="inline-flex items-center gap-2 rounded-lg bg-primary px-3 py-2 text-sm font-medium text-white hover:bg-emerald-600 dark:hover:bg-emerald-500/25">
                    <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 5l0 14" />
                        <path d="M5 12l14 0" />
                    </svg>
                    <span>New sale</span>
                </button>
            {% endblock %}
        </div>
    </div>
</div>
