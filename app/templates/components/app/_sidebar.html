<!-- dashboard sidebar -->
<aside
    x-data="sidebarNav()"
    :class="$store.sidebar.collapsed ? 'w-18' : 'w-64'"
    :data-collapsed="$store.sidebar.collapsed"
    class="sticky top-0 flex h-screen shrink-0 flex-col border-r border-neutral-200 bg-white/70 backdrop-blur-xl transition-[width] duration-200 dark:border-neutral-800 dark:bg-neutral-900/60"
    role="navigation"
    aria-label="Primary"
>
    <!-- ===== BRAND (aligns to header height) ===== -->
    <div class="flex h-16 shrink-0 items-center border-b border-neutral-200 px-4 dark:border-neutral-800">
        <a class="flex items-center gap-2 overflow-hidden" href="#" aria-label="Vireo home">
            <span class="shrink-0" aria-hidden="true">
                <svg class="h-6 w-6" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <defs>
                        <linearGradient id="axmk0" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#2BC4B0" />
                            <stop offset="0.55" stop-color="#1E9E96" />
                            <stop offset="1" stop-color="#6D5CF0" />
                        </linearGradient>
                    </defs>
                    <path
                        d="M4 4 H16 A12 12 0 0 1 28 16 V28 A0 0 0 0 1 28 28 H16 A12 12 0 0 1 4 16 V4 Z"
                        fill="url(#axmk0)"
                        stroke="none"
                    />
                    <circle cx="20.5" cy="11.5" r="2.6" fill="#0A0C11" fill-opacity="0.92" stroke="none" />
                </svg>
            </span>
            <span
                x-show="!$store.sidebar.collapsed"
                x-transition.opacity
                class="whitespace-nowrap font-display text-lg font-semibold tracking-wide text-neutral-900 dark:text-white"
            >VIREO</span>
        </a>
    </div>

    <!-- ===== MENU FILTER (distinct from ⌘K) ===== -->
    <div x-show="!$store.sidebar.collapsed" class="relative border-b border-neutral-200 px-3 py-3 dark:border-neutral-800">
        <svg
            class="pointer-events-none absolute left-6 top-1/2 h-4 w-4 -translate-y-1/2 text-neutral-400"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.75"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
        >
            <path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" />
            <path d="M21 21l-6 -6" />
        </svg>
        <input
            type="search"
            placeholder="Filter menu…"
            aria-label="Filter menu"
            class="w-full rounded-lg border border-neutral-200 bg-neutral-100/70 py-2 pl-9 pr-8 text-sm text-neutral-700 placeholder-neutral-400 focus:border-indigo-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/30 dark:border-neutral-700 dark:bg-neutral-800/60 dark:text-neutral-200"
            @input.debounce.120ms="filter($event.target.value)"
            @keydown.escape="clearFilter()"
            x-ref="filter"
        />
        <button
            type="button"
            class="absolute right-5 top-1/2 -translate-y-1/2 rounded p-1 text-neutral-400 hover:text-neutral-600 dark:hover:text-neutral-200"
            x-show="q"
            @click="clearFilter()"
            aria-label="Clear filter"
        >
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M18 6l-12 12" />
                <path d="M6 6l12 12" />
            </svg>
        </button>
    </div>

    <!-- ===== NAV TREE (only scrolling zone) ===== -->
    <nav class="flex-1 space-y-1 overflow-y-auto px-2 py-3" role="tree" aria-label="Main menu" @keydown="onTreeKey($event)" x-ref="tree">
        <!-- ====================== MAIN ====================== -->
        <p x-show="!$store.sidebar.collapsed" class="px-3 pb-1 pt-1 text-xs font-semibold uppercase tracking-wider text-neutral-400" role="presentation">Main</p>

        <div class="nav_grp" x-show="matchesGroup('dashboards')">
            <button
                type="button"
                class="flex w-full items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium text-neutral-600 hover:bg-neutral-100 hover:text-neutral-900 dark:text-neutral-300 dark:hover:bg-neutral-800 dark:hover:text-white"
                role="treeitem"
                aria-level="1"
                :aria-expanded="groups.dashboards"
                @click="toggle('dashboards')"
                tabindex="0"
            >
                <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M5 4h4a1 1 0 0 1 1 1v6a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1v-6a1 1 0 0 1 1 -1" />
                    <path d="M5 16h4a1 1 0 0 1 1 1v2a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1v-2a1 1 0 0 1 1 -1" />
                    <path d="M15 12h4a1 1 0 0 1 1 1v6a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1v-6a1 1 0 0 1 1 -1" />
                    <path d="M15 4h4a1 1 0 0 1 1 1v2a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1v-2a1 1 0 0 1 1 -1" />
                </svg>
                <span x-show="!$store.sidebar.collapsed" class="flex-1 truncate text-left">Dashboards</span>
                <span x-show="!$store.sidebar.collapsed" class="ml-auto rounded-full bg-neutral-100 px-1.5 py-0.5 text-[10px] font-semibold text-neutral-500 dark:bg-neutral-800 dark:text-neutral-400">17</span>
                <svg
                    x-show="!$store.sidebar.collapsed"
                    class="h-4 w-4 shrink-0 text-neutral-400 transition-transform duration-200"
                    :class="{ 'rotate-90': groups.dashboards }"
                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
                >
                    <path d="M9 6l6 6l-6 6" />
                </svg>
            </button>
            <div
                class="ml-3 space-y-0.5 border-l border-neutral-200 py-1 pl-3 dark:border-neutral-800"
                role="group"
                x-show="!$store.sidebar.collapsed && (groups.dashboards || filterOpen.dashboards)"
                x-collapse
            >
                <a
                    class="flex items-center gap-2 rounded-lg py-1.5 pl-4 pr-3 text-sm text-neutral-500 hover:bg-neutral-100 hover:text-neutral-900 aria-[current=page]:bg-indigo-50 aria-[current=page]:text-indigo-600 dark:text-neutral-400 dark:hover:bg-neutral-800 dark:hover:text-white dark:aria-[current=page]:bg-indigo-500/10 dark:aria-[current=page]:text-indigo-400"
                    role="treeitem"
                    aria-level="2"
                    href=""
                    data-nav-label="Sales"
                    tabindex="-1"
                >Sales</a>
                <a
                
                    class="flex items-center gap-2 rounded-lg py-1.5 pl-4 pr-3 text-sm text-neutral-500 hover:bg-neutral-100 hover:text-neutral-900 aria-[current=page]:bg-indigo-50 aria-[current=page]:text-indigo-600 dark:text-neutral-400 dark:hover:bg-neutral-800 dark:hover:text-white dark:aria-[current=page]:bg-indigo-500/10 dark:aria-[current=page]:text-indigo-400"
                    role="treeitem"
                    aria-level="2"
                    href="#"
                    data-nav-label="Analytics"
                    tabindex="-1"
                >Analytics</a>
            </div>
        </div>

        <!-- ====================== MODULES ====================== -->
        <p x-show="!$store.sidebar.collapsed" class="px-3 pb-1 pt-4 text-xs font-semibold uppercase tracking-wider text-neutral-400" role="presentation">Modules</p>

        <div class="nav_grp" x-show="matchesGroup('crm')">
            <button
                type="button"
                class="flex w-full items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium text-neutral-600 hover:bg-neutral-100 hover:text-neutral-900 dark:text-neutral-300 dark:hover:bg-neutral-800 dark:hover:text-white"
                role="treeitem"
                aria-level="1"
                :aria-expanded="groups.crm"
                @click="toggle('crm')"
                tabindex="-1"
            >
                <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M10 13a2 2 0 1 0 4 0a2 2 0 0 0 -4 0" />
                    <path d="M8 21v-1a2 2 0 0 1 2 -2h4a2 2 0 0 1 2 2v1" />
                    <path d="M15 5a2 2 0 1 0 4 0a2 2 0 0 0 -4 0" />
                    <path d="M17 10h2a2 2 0 0 1 2 2v1" />
                    <path d="M5 5a2 2 0 1 0 4 0a2 2 0 0 0 -4 0" />
                    <path d="M3 13v-1a2 2 0 0 1 2 -2h2" />
                </svg>
                <span x-show="!$store.sidebar.collapsed" class="flex-1 truncate text-left">CRM</span>
                <svg
                    x-show="!$store.sidebar.collapsed"
                    class="h-4 w-4 shrink-0 text-neutral-400 transition-transform duration-200"
                    :class="{ 'rotate-90': groups.crm }"
                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
                >
                    <path d="M9 6l6 6l-6 6" />
                </svg>
            </button>
            <div
                class="ml-3 space-y-0.5 border-l border-neutral-200 py-1 pl-3 dark:border-neutral-800"
                role="group"
                x-show="!$store.sidebar.collapsed && (groups.crm || filterOpen.crm)"
                x-collapse
            >
                <a class="flex items-center gap-2 rounded-lg py-1.5 pl-4 pr-3 text-sm text-neutral-500 hover:bg-neutral-100 hover:text-neutral-900 aria-[current=page]:bg-indigo-50 aria-[current=page]:text-indigo-600 dark:text-neutral-400 dark:hover:bg-neutral-800 dark:hover:text-white dark:aria-[current=page]:bg-indigo-500/10 dark:aria-[current=page]:text-indigo-400"
                   role="treeitem" aria-level="2" href="" data-nav-label="CRM Dashboard" tabindex="-1">CRM Dashboard</a>
                <a class="flex items-center gap-2 rounded-lg py-1.5 pl-4 pr-3 text-sm text-neutral-500 hover:bg-neutral-100 hover:text-neutral-900 aria-[current=page]:bg-indigo-50 aria-[current=page]:text-indigo-600 dark:text-neutral-400 dark:hover:bg-neutral-800 dark:hover:text-white dark:aria-[current=page]:bg-indigo-500/10 dark:aria-[current=page]:text-indigo-400"
                   role="treeitem" aria-level="2" href="#" data-nav-label="Contacts" tabindex="-1">Contacts</a>
                <a class="flex items-center gap-2 rounded-lg py-1.5 pl-4 pr-3 text-sm text-neutral-500 hover:bg-neutral-100 hover:text-neutral-900 aria-[current=page]:bg-indigo-50 aria-[current=page]:text-indigo-600 dark:text-neutral-400 dark:hover:bg-neutral-800 dark:hover:text-white dark:aria-[current=page]:bg-indigo-500/10 dark:aria-[current=page]:text-indigo-400"
                   role="treeitem" aria-level="2" href="" data-nav-label="Companies" tabindex="-1">Companies</a>
            </div>
        </div>
    </nav>

    <!-- ===== FOOT: mini user card ===== -->
    <div class="mt-auto shrink-0 border-t border-neutral-200 p-3 dark:border-neutral-800">
        <div class="flex items-center gap-3">
            <img class="h-9 w-9 shrink-0 rounded-full object-cover ring-1 ring-neutral-200 dark:ring-neutral-700" src="https://i.pravatar.cc/80?img=12" alt="" width="36" height="36" />
            <span x-show="!$store.sidebar.collapsed" class="flex min-w-0 flex-col leading-tight">
                <b class="truncate text-sm font-semibold text-neutral-900 dark:text-white">Jacob Gerrald</b>
                <small class="truncate text-xs text-neutral-400">jacob@vireo.io</small>
            </span>
            <a
            
                x-show="!$store.sidebar.collapsed"
                class="ml-auto shrink-0 rounded-lg p-2 text-neutral-400 hover:bg-neutral-100 hover:text-neutral-600 dark:hover:bg-neutral-800 dark:hover:text-neutral-200"
                href=""
                aria-label="Log out"
            >
                <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M14 8v-2a2 2 0 0 0 -2 -2h-7a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h7a2 2 0 0 0 2 -2v-2" />
                    <path d="M9 12h12l-3 -3" />
                    <path d="M18 15l3 -3" />
                </svg>
            </a>
        </div>
    </div>
</aside>
