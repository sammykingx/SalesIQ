                                    <linearGradient

                                        x1="4"
                                        y1="4"
                                        x2="28"

                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.75"
                        stroke-linecap="round"

                        height="24"
                        aria-hidden="true"
                    >

                        <path d="M21 21l-6 -6" />
                    </svg>
                    <input
                        type="search"
                        class="ax-sidebar__filter"
                        placeholder="Filter menu…"
                        aria-label="Filter menu"
                        @input.debounce.120ms="filter($event.target.value)"
                        @keydown.escape="clearFilter()"
                        x-ref="filter"
                    />
                    <button
                        type="button"
                        class="ax-sidebar__filter-clear"
                        x-show="q"
                        @click="clearFilter()"
                        aria-label="Clear filter"
                    >
                        <svg
                            class="ax-icon"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.75"
                            stroke-linecap="round"

                            height="24"
                            aria-hidden="true"
