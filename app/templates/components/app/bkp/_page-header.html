<!--the main page header the holde the bread crumbs, the page title, short description and action buttons-->
<div class="ax-page-head">
                        <div class="ax-page-head__row">
                            <div>
                                <nav class="ax-breadcrumb" data-ax-breadcrumb aria-label="Breadcrumb"></nav>
                                <h1 class="ax-page-head__title">Starter Page</h1>
                                <p class="ax-page-head__subtitle">
                                    A blank scaffold with the standard page shell — drop your content into the marked
                                    region below.
                                </p>
                            </div>
                            <div class="ax-page-head__actions">
                                <button type="button" class="ax-btn ax-btn--ghost">

                                        viewBox="0 0 24 24"

                                        stroke="currentColor"

                                    <span class="ax-btn__label">View docs</span>
                                </button>
                                <button type="button" class="ax-btn ax-btn--primary">
                                    <svg
                                        class="ax-btn__icon"
                                        viewBox="0 0 24 24"
                                        fill="none"
                                        stroke="currentColor"
                                        stroke-width="1.75"
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        aria-hidden="true"
                                    >
                                        <path d="M12 5l0 14" />

                        </div>
