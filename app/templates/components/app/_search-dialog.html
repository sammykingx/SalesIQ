<!--
    COMMAND PALETTE · #ax-command
    Opened by: the header's ⌘K button ($dispatch('ax-command-open')), Cmd/Ctrl+K
    anywhere on the page, or any element with @click="$dispatch('ax-command-open')".
    Results are computed client-side from nav-manifest.js — see search-dialog.js.
-->
<div
    id="ax-command"
    x-data="commandPalette()"
    x-trap.noscroll="open"
    @ax-command-open.window="openPalette()"
    @keydown.window.cmd.k.prevent="openPalette()"
    @keydown.window.ctrl.k.prevent="openPalette()"
    @keydown.escape.window="close()"
    x-show="open"
    x-cloak
    class="fixed inset-0 z-50 flex items-start justify-center px-4 pt-[12vh]"
    role="dialog"
    aria-modal="true"
    aria-labelledby="ax-command-title"
>
    <!-- Click-catch scrim -->
    <button
        type="button"
        class="fixed inset-0 bg-neutral-900/40 backdrop-blur-sm"
        @click="close()"
        aria-label="Close search"
        tabindex="-1"
        x-transition.opacity
    ></button>

    <div
        class="relative z-10 w-full max-w-xl overflow-hidden rounded-2xl border border-neutral-200 bg-white shadow-2xl shadow-black/10 dark:border-neutral-800 dark:bg-neutral-900"
        x-transition:enter="transition ease-out duration-150"
        x-transition:enter-start="opacity-0 scale-95"
        x-transition:enter-end="opacity-100 scale-100"
    >
        <h2 id="ax-command-title" class="sr-only">Search or jump to</h2>

        <!-- ===== QUERY ROW ===== -->
        <div class="flex items-center gap-3 border-b border-neutral-200 px-4 py-3 dark:border-neutral-800">
            <svg class="h-5 w-5 shrink-0 text-neutral-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" />
                <path d="M21 21l-6 -6" />
            </svg>
            <input
                type="text"
                x-ref="input"
                x-model="query"
                @input="activeIndex = 0"
                @input.debounce.250ms="search()"
                @keydown.down.prevent="moveDown()"
                @keydown.up.prevent="moveUp()"
                @keydown.enter.prevent="select()"
                placeholder="Search pages, apps, invoices, customers…"
                aria-label="Search pages, apps, invoices and customers"
                aria-controls="ax-command-results"
                autocomplete="off"
                autocapitalize="off"
                autocorrect="off"
                spellcheck="false"
                class="flex-1 border-0 bg-transparent text-sm text-neutral-900 placeholder-neutral-400 focus:outline-none focus:ring-0 dark:text-white"
            />
            <svg x-show="loading" class="h-4 w-4 shrink-0 animate-spin text-neutral-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <path d="M21 12a9 9 0 1 1 -6.219 -8.56" />
            </svg>
            <kbd class="hidden rounded border border-neutral-300 px-1.5 py-0.5 font-mono text-[10px] text-neutral-400 sm:inline dark:border-neutral-600">esc</kbd>
            <button
                type="button"
                class="inline-flex h-7 w-7 items-center justify-center rounded-lg text-neutral-400 hover:bg-neutral-100 hover:text-neutral-600 dark:hover:bg-neutral-800 dark:hover:text-neutral-200"
                @click="close()"
                aria-label="Close search"
            >
                <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M18 6l-12 12" />
                    <path d="M6 6l12 12" />
                </svg>
            </button>
        </div>

        <!-- ===== RESULTS ===== -->
        <div id="ax-command-results" x-ref="results" class="max-h-80 overflow-y-auto p-2" role="listbox" aria-label="Search results">
            <template x-for="(item, idx) in filtered" :key="item.group + item.label">
                <div>
                    <p
                        x-show="idx === 0 || filtered[idx - 1].group !== item.group"
                        class="px-2 pb-1 pt-3 text-xs font-semibold uppercase tracking-wide text-neutral-400 first:pt-1"
                        x-text="item.group"
                    ></p>
                    <div
                        role="option"
                        :aria-selected="idx === activeIndex"
                        :data-active="idx === activeIndex"
                        @mouseenter="activeIndex = idx"
                        @click="select(item)"
                        class="flex cursor-pointer items-center gap-3 rounded-lg px-3 py-2 text-sm"
                        :class="idx === activeIndex ? 'bg-indigo-50 text-indigo-600 dark:bg-indigo-500/10 dark:text-indigo-400' : 'text-neutral-600 dark:text-neutral-300'"
                    >
                        <span class="flex-1 truncate" x-text="item.label"></span>
                        <span x-show="item.meta" class="shrink-0 font-mono text-xs text-neutral-400" x-text="item.meta"></span>
                    </div>
                </div>
            </template>

            <p x-show="!loading && filtered.length === 0" class="px-3 py-6 text-center text-sm text-neutral-400">
                No results for "<span x-text="query"></span>"
            </p>
        </div>

        <!-- ===== KEY HINTS ===== -->
        <div class="hidden items-center gap-4 border-t border-neutral-200 px-4 py-2 text-xs text-neutral-400 sm:flex dark:border-neutral-800">
            <span class="flex items-center gap-1"><kbd class="rounded border border-neutral-300 px-1 dark:border-neutral-600">↑</kbd><kbd class="rounded border border-neutral-300 px-1 dark:border-neutral-600">↓</kbd> navigate</span>
            <span class="flex items-center gap-1"><kbd class="rounded border border-neutral-300 px-1 dark:border-neutral-600">↵</kbd> open</span>
            <span class="flex items-center gap-1"><kbd class="rounded border border-neutral-300 px-1 dark:border-neutral-600">esc</kbd> close</span>
        </div>
    </div>
</div>
