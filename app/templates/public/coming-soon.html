{% load static %} {% load django_vite %}
<!doctype html>
<html lang="en">
    <head>
        {% vite_hmr_client %}
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- Favicon & Manifest -->
        <link rel="icon" href="{% static 'images/logo/light-favicon.png' %}" type="image/png" />
        <link rel="apple-touch-icon" sizes="180x180" href="{% static 'images/favicon/apple-icon-180x180.png' %}" />
        <link rel="icon" type="image/png" sizes="32x32" href="{% static 'images/favicon/favicon-32x32.png' %}" />
        <link rel="icon" type="image/png" sizes="16x16" href="{% static 'images/favicon/favicon-16x16.png' %}" />
        <link rel="manifest" href="{% static 'images/favicon/manifest.json' %}" />

        <!-- Zero-Flash Dark Mode Script -->
        <script>
            (function () {
                try {
                    var theme = localStorage.getItem("theme");
                    if (theme === "dark" || (!theme && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
                        document.documentElement.classList.add("dark");
                    } else {
                        document.documentElement.classList.remove("dark");
                    }
                } catch (e) {}
            })();
        </script>

        <title>{% block title %}SalesIQ - Know your sales. Grow your business.{% endblock %}</title>

        {% vite_asset 'src/entries/app.js' %} {% block extra_head %}{% endblock %}
    </head>
    <body
        class="bg-surface dark:bg-color-ink text-color-ink dark:text-surface transition-colors duration-300 font-sans antialiased"
        x-data="{
        darkMode: document.documentElement.classList.contains('dark'),
        mobileMenuOpen: false,
        toastMessage: '',
        showToast: false,
        toggleTheme() {
            this.darkMode = !this.darkMode;
            localStorage.setItem('theme', this.darkMode ? 'dark' : 'light');
            if (this.darkMode) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        },
        triggerToast(msg) {
            this.toastMessage = msg;
            this.showToast = true;
            setTimeout(() => { this.showToast = false; }, 4000);
        }
    }"
        @trigger-toast.window="triggerToast($event.detail)"
    >
        <!-- Global Toast Notification Component -->
        <div
            x-show="showToast"
            x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="opacity-0 translate-y-[-10px]"
            x-transition:enter-end="opacity-100 translate-y-0"
            x-transition:leave="transition ease-in duration-200"
            x-transition:leave-start="opacity-100 translate-y-0"
            x-transition:leave-end="opacity-0 translate-y-[-10px]"
            class="fixed top-5 right-5 z-50 bg-primary text-white px-5 py-3 rounded-lg shadow-lg flex items-center gap-2 font-medium"
            style="display: none"
        >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
            </svg>
            <span x-text="toastMessage"></span>
        </div>

        <div
            x-data="{ showToast: false, toastMessage: '' }"
            @trigger-toast.window="toastMessage = $event.detail; showToast = true; setTimeout(() => showToast = false, 4000)"
            x-show="showToast"
            x-transition
            class="fixed top-5 right-5 z-50 bg-primary text-white px-5 py-3 rounded-lg shadow-lg flex items-center gap-2 font-medium"
            style="display: none"
        >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
            </svg>
            <span x-text="toastMessage"></span>
        </div>

        <!-- Public Header -->
        <header class="w-full max-w-7xl mx-auto px-6 py-6 flex items-center justify-between relative z-10">
    <!-- Left: Brand Logo -->
    <a href="#" class="flex items-center gap-2">
        <template x-if="!darkMode">
            <img src="{% static 'images/logo/main-logo-light.png' %}" alt="SalesIQ Logo" class="h-8 w-auto" />
        </template>
        <template x-if="darkMode">
            <img src="{% static 'images/logo/main-logo-dark.png' %}" alt="SalesIQ Logo" class="h-8 w-auto" />
        </template>
    </a>

    <!-- Right: Theme Switcher & Mobile Drawer Trigger -->
    <div class="flex items-center gap-4 sm:gap-6">
        <!-- Light / Dark Mode Toggle -->
        <button
            @click="toggleTheme()"
            type="button"
            class="p-2 rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors focus:outline-none"
            aria-label="Toggle theme"
        >
            <!-- Sun Icon (Active in Dark Mode) -->
            <svg
                x-show="darkMode"
                class="w-5 h-5 text-amber-400"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
            >
                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"
                ></path>
            </svg>
            <!-- Moon Icon (Active in Light Mode) -->
            <svg
                x-show="!darkMode"
                class="w-5 h-5 text-slate-600 dark:text-slate-400"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
            >
                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
                ></path>
            </svg>
        </button>

        <!-- Mobile Trigger: "Notify Me" Link (Hidden on Desktop) -->
        <button
            @click="mobileMenuOpen = true"
            type="button"
            class="lg:hidden text-sm font-semibold text-color-ink dark:text-surface hover:text-primary transition-colors focus:outline-none"
        >
            Notify Me
        </button>
    </div>
</header>

        

        <!-- Main Body Content Injection -->
        
    </body>
</html>
