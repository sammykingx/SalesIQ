{# layouts/_base_errors.html #}
{% extends "layouts/_base.html" %}
{% load static %}

{% block body %}
<div 
  x-data="{
    darkMode: localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches),
    toggleTheme() {
      this.darkMode = !this.darkMode;
      localStorage.setItem('theme', this.darkMode ? 'dark' : 'light');
      if (this.darkMode) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    }
  }"
  :class="{ 'dark': darkMode }"
  class="relative min-h-screen font-sans bg-surface dark:bg-[#080C14] text-ink-900 dark:text-surface flex flex-col justify-between items-center overflow-x-hidden transition-colors duration-300"
>
  <!-- Ambient Background Orbs -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
    <div class="absolute -top-32 -left-32 w-96 h-96 bg-primary/10 dark:bg-primary/5 rounded-full blur-[120px]"></div>
    <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-secondary/10 dark:bg-secondary/5 rounded-full blur-[120px]"></div>
  </div>

  <header class="relative z-10 w-full max-w-7xl px-6 py-6 flex justify-between items-center">
    <a href="#" class="flex items-center group">
      <template x-if="!darkMode">
        <img src="{% static 'images/logo/main-logo-light.png' %}" alt="SalesIQ Logo" class="h-10 w-auto object-contain transition-transform group-hover:scale-105" />
      </template>
      <template x-if="darkMode">
        <img src="{% static 'images/logo/main-logo-dark.png' %}" alt="SalesIQ Logo" class="h-10 w-auto object-contain transition-transform group-hover:scale-105" />
      </template>
    </a>

    <button 
      @click="toggleTheme()" 
      type="button" 
      class="text-ink-600 dark:text-ink-400 hover:text-ink-900 dark:hover:text-white transition-colors p-2 rounded-xl bg-white dark:bg-ink-900/60 border border-ink-100 dark:border-white/10 focus:outline-none focus:ring-1 focus:ring-primary/50 shadow-xs backdrop-blur-md cursor-pointer" 
      aria-label="Toggle Theme"
    >
      <svg x-show="darkMode" class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
      </svg>
      <svg x-show="!darkMode" class="w-4 h-4 text-ink-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
      </svg>
    </button>
  </header>

  <main class="relative z-10 w-full flex-1 flex flex-col items-center justify-center px-4 py-8">
    {% block error_content %}{% endblock %}
  </main>

  <footer class="relative z-10 py-6 text-center text-xs text-ink-600 dark:text-ink-400">
    &copy; {% now "Y" %} SalesIQ. Know your sales. Grow your business.
  </footer>
</div>
{% endblock %}
