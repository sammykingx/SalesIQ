{% load static %}
<style>
    #app-preloader {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #f8fafc;
        transition: opacity 0.5s ease-out;
    }
    #app-preloader.is-hidden {
        opacity: 0;
        pointer-events: none;
    }

    .app-preloader__ring-wrap {
        position: relative;
        width: 80px;
        height: 80px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .app-preloader__ring {
        position: absolute;
        inset: 0;
        border-radius: 9999px;
        border: 1px solid transparent;
    }
    .app-preloader__ring--static {
        border-color: rgba(16, 185, 129, 0.15);
    }
    .app-preloader__ring--spin {
        border-top-color: #10b981;
        animation: app-preloader-spin 0.8s linear infinite;
    }
    .app-preloader__icon {
        width: 36px;
        height: 36px;
        object-fit: contain;
        display: block;
        animation: app-preloader-pulse 1.1s ease-in-out infinite;
    }

    @keyframes app-preloader-spin {
        to { transform: rotate(360deg); }
    }
    @keyframes app-preloader-pulse {
        0%, 100% { transform: scale(0.9); opacity: 0.85; }
        50%      { transform: scale(1.05); opacity: 1; }
    }
</style>

<div id="app-preloader">
    <div class="app-preloader__ring-wrap">
        <span class="app-preloader__ring app-preloader__ring--static"></span>
        <span class="app-preloader__ring app-preloader__ring--spin"></span>
        <img
            src="{% static 'images/logo/icon-light.png' %}"
            alt="SalesIQ"
            width="36"
            height="36"
            class="app-preloader__icon"
        >
    </div>
</div>
